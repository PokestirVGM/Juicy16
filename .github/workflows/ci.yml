name: CI

# Quality gates for Phase 5.2 of ROADMAP.md. Each job delegates to
# tools/ci_gates.sh so the hosted run and a developer's local run cannot drift
# apart. See docs/CI.md for what a passing run does and does not prove.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release tags re-run these gates instead of trusting an earlier result.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JUCE_VERSION: 8.0.14

jobs:
  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci_gates.sh docs

  macos-debug:
    name: macOS Debug (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Cache JUCE ${{ env.JUCE_VERSION }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ~/juicydeps
          key: juce-${{ env.JUCE_VERSION }}-macos-14-${{ runner.arch }}

      - name: Build and install pinned JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          cmake -S "$RUNNER_TEMP/JUCE" -B "$RUNNER_TEMP/JUCE/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/juicydeps"
          cmake --build "$RUNNER_TEMP/JUCE/build" --target install --parallel 3

      - name: Cache pinned dependency closure
        uses: actions/cache@v4
        with:
          path: build/macos11-deps
          key: macos11-deps-${{ hashFiles('tools/build_macos_dependencies.sh', 'vendor/fluidsynth_patched/**', 'vendor/libsndfile_patched/**') }}-${{ runner.arch }}

      - name: Build and test
        run: JUICY16_BUILD_JOBS=3 tools/ci_gates.sh debug

      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-debug-test-logs
          path: build-ci-debug/Testing/**
          if-no-files-found: ignore

  macos-sanitizers:
    name: macOS ASan + UBSan (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Cache JUCE ${{ env.JUCE_VERSION }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ~/juicydeps
          key: juce-${{ env.JUCE_VERSION }}-macos-14-${{ runner.arch }}

      - name: Build and install pinned JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          cmake -S "$RUNNER_TEMP/JUCE" -B "$RUNNER_TEMP/JUCE/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/juicydeps"
          cmake --build "$RUNNER_TEMP/JUCE/build" --target install --parallel 3

      - name: Cache pinned dependency closure
        uses: actions/cache@v4
        with:
          path: build/macos11-deps
          key: macos11-deps-${{ hashFiles('tools/build_macos_dependencies.sh', 'vendor/fluidsynth_patched/**', 'vendor/libsndfile_patched/**') }}-${{ runner.arch }}

      # Only the offline harnesses are sanitized; an unsanitized host cannot load
      # a sanitized plugin bundle.
      - name: Build and run sanitized harnesses
        run: JUICY16_BUILD_JOBS=3 tools/ci_gates.sh asan

  macos-leaks:
    name: macOS leaks (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake pkg-config

      - name: Cache JUCE ${{ env.JUCE_VERSION }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ~/juicydeps
          key: juce-${{ env.JUCE_VERSION }}-macos-14-${{ runner.arch }}

      - name: Build and install pinned JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          cmake -S "$RUNNER_TEMP/JUCE" -B "$RUNNER_TEMP/JUCE/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/juicydeps"
          cmake --build "$RUNNER_TEMP/JUCE/build" --target install --parallel 3

      - name: Cache pinned dependency closure
        uses: actions/cache@v4
        with:
          path: build/macos11-deps
          key: macos11-deps-${{ hashFiles('tools/build_macos_dependencies.sh', 'vendor/fluidsynth_patched/**', 'vendor/libsndfile_patched/**') }}-${{ runner.arch }}

      # LeakSanitizer is unavailable on Darwin arm64, so the ASan job runs with
      # leak detection off. macOS `leaks` covers that gap, including the Core
      # Foundation objects the bookmark path owns.
      - name: Run every offline harness under leaks
        run: JUICY16_BUILD_JOBS=3 tools/ci_gates.sh leaks

      - name: Archive leaks reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-leaks-reports
          path: build-ci-debug/Testing/leaks-*.log
          if-no-files-found: ignore

  macos-release-strict:
    name: macOS portable Release (arm64, strict)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install pkg-config

      - name: Cache JUCE ${{ env.JUCE_VERSION }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ~/juicydeps
          key: juce-${{ env.JUCE_VERSION }}-macos-14-${{ runner.arch }}

      - name: Build and install pinned JUCE
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$JUCE_VERSION" \
            https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
          cmake -S "$RUNNER_TEMP/JUCE" -B "$RUNNER_TEMP/JUCE/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/juicydeps"
          cmake --build "$RUNNER_TEMP/JUCE/build" --target install --parallel 3

      # Keyed on the recipe itself: every pinned version and checksum lives there,
      # so editing it necessarily rebuilds the closure. The gate builds it when
      # the cache misses.
      - name: Cache pinned dependency closure
        uses: actions/cache@v4
        with:
          path: build/macos11-deps
          key: macos11-deps-${{ hashFiles('tools/build_macos_dependencies.sh', 'vendor/fluidsynth_patched/**', 'vendor/libsndfile_patched/**') }}-${{ runner.arch }}

      # Covers architecture, deployment target, signatures, linked and embedded
      # paths, DLS and SF3 loading, VST3 unit routing, and release metadata.
      - name: Strict Release gate
        run: JUICY16_BUILD_JOBS=3 tools/ci_gates.sh release

      - name: Validate the Audio Unit
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          cp -R build-release/JuicySFPlugin_artefacts/Release/AU/Juicy16.component \
            "$HOME/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Jc16 Pkst

      - name: Stage the unsigned candidate package
        run: |
          distribute/bundle_macos.sh \
            build-release/JuicySFPlugin_artefacts/Release BC1

      - name: Archive candidate package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-candidate
          path: |
            distribute/out/*.zip
            distribute/out/*.sha256
          if-no-files-found: error

  windows-vst3:
    name: Windows x64 (${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned JUCE
        uses: actions/cache@v4
        with:
          path: |
            build-win-juce-source
            build-win-juce-install
          key: juce-${{ env.JUCE_VERSION }}-windows-2022-native-v2

      - name: Cache static dependency closure and original sources
        id: windows-deps-cache
        uses: actions/cache@v4
        with:
          path: |
            build-win-deps
            build-win-dependency-sources
          key: windows-native-${{ matrix.configuration }}-${{ hashFiles('tools/build_windows_dependencies.ps1', 'tools/windows_common.ps1', 'tools/extract_source.py', 'vendor/fluidsynth_patched/**', 'vendor/libsndfile_patched/**') }}

      - name: Native strict build and test
        shell: pwsh
        run: |
          $arguments = @{
            Configuration = '${{ matrix.configuration }}'
            BuildJobs = 3
          }
          if (Test-Path 'build-win-juce-install/lib/cmake/JUCE-8.0.14/JUCEConfig.cmake') {
            $arguments.SkipJuce = $true
          }
          if ('${{ steps.windows-deps-cache.outputs.cache-hit }}' -eq 'true') {
            $arguments.SkipDependencies = $true
          }
          ./tools/verify_windows.ps1 @arguments

      - name: Package portable, installer and corresponding source
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          ./distribute/bundle_windows.ps1 -Candidate BC1 `
            -Iscc 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'

      - name: Test installer lifecycle in isolated directories
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $installer = Get-ChildItem distribute/out/*-Setup.exe | Select-Object -First 1
          $portable = Get-ChildItem distribute/out/*-Portable -Directory | Select-Object -First 1
          ./tests/WindowsInstallerTests.ps1 -Installer $installer.FullName -PortableDir $portable.FullName

      - name: Archive test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ matrix.configuration }}-logs
          path: |
            build-win/verification-*.txt
            build-win/Testing/**
            build-win/installer-roundtrip/*.log
          if-no-files-found: warn

      - name: Archive Windows candidate
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: Juicy16-windows-x64-candidate
          path: |
            distribute/out/*.zip
            distribute/out/*.exe
            distribute/out/*.sha256
          if-no-files-found: error
