<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: #d8a24a; } a:hover { color: #b8842f; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 920px; height: 580px; box-sizing: border-box; background: #212121; color: #e4e4e4; display: flex; flex-direction: column; font-size: 12px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 0 8px;">
    <div style="flex-grow: 1; height: 25px; background: #191919; border: 1px solid #343434; border-radius: 3px; display: flex; align-items: center; padding: 0 8px; gap: 6px; overflow: hidden;">
      <span style="color: #7d7d7d; white-space: nowrap;">Game MIDI Rips / VGMTrans Output /</span>
      <span style="color: #e4e4e4; font-weight: 500; white-space: nowrap;">SEQ_BGM_VS_RAI.dls</span>
    </div>
    <div style="width: 25px; height: 25px; background: #2c2c2c; border: 1px solid #3d3d3d; border-radius: 3px; display: flex; align-items: center; justify-content: center;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b4b4b4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    </div>
  </div>

  <div style="margin: 8px 8px 0 8px; border: 1px solid #343434; border-radius: 3px; overflow: hidden; flex-grow: 1; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; height: 28px; background: #2a2a2a; border-bottom: 1px solid #383838; color: #8f8f8f; font-size: 11px; letter-spacing: 0.04em;">
      <div style="width: 32px; text-align: right; padding-right: 8px;">CH</div>
      <div style="flex-grow: 1; padding-left: 10px;">INSTRUMENT</div>
      <div style="width: 62px; text-align: center;">VOL</div>
      <div style="width: 62px; text-align: center;">PAN</div>
    </div>
    <sc-for list="{{channels}}" as="ch" hint-placeholder-count="16">
      <div style="display: flex; align-items: center; height: 24px; background: {{ch.rowBg}}; border-bottom: 1px solid #262626;">
        <div class="mono" style="width: 32px; text-align: right; padding-right: 8px; color: {{ch.chColour}}; font-size: 11px;">{{ch.num}}</div>
        <div style="flex-grow: 1; padding-left: 10px; display: flex; align-items: center; gap: 6px; min-width: 0;">
          <span class="mono" style="color: #8a8a8a; font-size: 11px;">{{ch.program}}</span>
          <span style="color: {{ch.nameColour}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ch.name}}</span>
        </div>
        <div style="width: 12px; display: flex; align-items: center; justify-content: center;">
          <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#6a6a6a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
        <div style="width: 62px; display: flex; align-items: center; justify-content: center; gap: 5px;">
          <svg width="20" height="20" viewBox="0 0 26 26">
            <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"></path>
            <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{ch.volDash}}"></path>
          </svg>
          <span class="mono" style="color: #9d9d9d; font-size: 10px; width: 20px;">{{ch.volume}}</span>
        </div>
        <div style="width: 62px; display: flex; align-items: center; justify-content: center; gap: 5px;">
          <svg width="20" height="20" viewBox="0 0 26 26">
            <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"></path>
            <line x1="13" y1="3.5" x2="13" y2="5.5" stroke="#5a5a5a" stroke-width="1.5" stroke-linecap="round"></line>
            <line x1="13" y1="13" x2="13" y2="5.6" stroke="#cfcfcf" stroke-width="2.2" stroke-linecap="round" transform="rotate({{ch.panAngle}} 13 13)"></line>
          </svg>
          <span class="mono" style="color: #9d9d9d; font-size: 10px; width: 20px;">{{ch.pan}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; margin: 8px 8px 0 8px; padding: 0 10px; height: 40px; background: #262626; border: 1px solid #343434; border-radius: 3px;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <div style="width: 26px; height: 14px; border-radius: 7px; background: {{accent}}; display: flex; align-items: center; justify-content: flex-end; padding: 0 2px; box-sizing: border-box;">
        <div style="width: 10px; height: 10px; border-radius: 50%; background: #1a1a1a;"></div>
      </div>
      <span style="color: #e4e4e4; font-weight: 500;">Reverb</span>
    </div>
    <div style="display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; background: #1c1c1c; border: 1px solid #383838; border-radius: 3px;">
      <span style="color: #c9c9c9;">Universal</span>
      <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#6a6a6a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <sc-for list="{{reverb}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 5px;">
          <svg width="22" height="22" viewBox="0 0 26 26">
            <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"></path>
            <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{r.dash}}"></path>
          </svg>
          <span style="color: #8f8f8f; font-size: 11px;">{{r.label}}</span>
        </div>
      </sc-for>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="width: 1px; height: 22px; background: #383838;"></div>
    <div style="display: flex; align-items: center; gap: 7px;">
      <span style="color: #8f8f8f; font-size: 11px;">MASTER</span>
      <svg width="24" height="24" viewBox="0 0 26 26">
        <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"></path>
        <path d="M 13 3.25 A 9.75 9.75 0 0 1 19.9 19.9" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 100"></path>
        <line x1="13" y1="13" x2="13" y2="5.6" stroke="#e4e4e4" stroke-width="2.4" stroke-linecap="round"></line>
      </svg>
      <span class="mono" style="color: #e4e4e4;">0.0 dB</span>
    </div>
  </div>

  <div style="margin: 8px 8px 0 8px; height: 62px; border: 1px solid #343434; border-radius: 3px; background: #171717; display: flex; align-items: stretch; overflow: hidden;">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="28">
      <div style="width: {{k.width}}; background: {{k.fill}}; border-right: 1px solid #101010; position: relative;"></div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; height: 24px; padding: 0 10px; color: #7d7d7d; font-size: 11px;">
    Juicy16 v0.5.1-alpha.6 — Bank loaded successfully.
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":920,"height":580}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#d8a24a';
    const rows = [
      ['0:030', 'Multi-Region Instrument', 115, 64],
      ['0:060', 'Single-Region Instrument', 100, 40],
      ['0:029', 'Single-Region Instrument', 104, 88],
      ['0:060', 'Single-Region Instrument', 96, 64],
      ['0:027', 'Multi-Region Instrument', 110, 20],
      ['0:060', 'Single-Region Instrument', 98, 108],
      ['0:061', 'Single-Region Instrument', 92, 64],
      ['0:044', 'Multi-Region Instrument', 106, 50],
      ['0:080', 'Drumset', 120, 64],
      ['0:000', 'Multi-Region Instrument', 100, 64],
      ['0:080', 'Drumset', 118, 64],
      ['0:046', 'Single-Region Instrument', 88, 76],
      ['0:000', 'Multi-Region Instrument', 100, 64],
      ['0:000', 'Multi-Region Instrument', 100, 64],
      ['0:000', 'Multi-Region Instrument', 100, 64],
      ['0:000', 'Multi-Region Instrument', 100, 64]
    ];
    const arc = 45.95;
    const channels = rows.map(function (r, i) {
      return {
        num: i + 1,
        program: r[0],
        name: r[1],
        volume: r[2],
        pan: r[3],
        volDash: (r[2] / 127 * arc).toFixed(1) + ' 100',
        panAngle: (-135 + r[3] / 127 * 270).toFixed(1),
        rowBg: i === 0 ? '#2f2f2f' : (i % 2 ? '#232323' : '#1e1e1e'),
        chColour: i === 0 ? '#ffffff' : '#7d7d7d',
        nameColour: i === 0 ? '#ffffff' : '#cfcfcf'
      };
    });
    const reverb = [
      { label: 'Size', dash: (0.42 * arc).toFixed(1) + ' 100' },
      { label: 'Damp', dash: (0.30 * arc).toFixed(1) + ' 100' },
      { label: 'Width', dash: (0.80 * arc).toFixed(1) + ' 100' },
      { label: 'Level', dash: (0.55 * arc).toFixed(1) + ' 100' }
    ];
    const pattern = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
    const lit = { 3: 1, 8: 1, 15: 1, 22: 1 };
    const keys = [];
    for (let i = 0; i < 36; i++) {
      const black = pattern[i % 12] === 1;
      keys.push({
        width: black ? '10px' : '26px',
        fill: lit[i] ? accent : (black ? '#232323' : '#c8c8c8')
      });
    }
    return { accent, channels, reverb, keys };
  }
}
</script>
</body>
</html>
