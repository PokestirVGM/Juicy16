<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: #d8a24a; } a:hover { color: #b8842f; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 920px; height: 580px; box-sizing: border-box; background: #131313; color: #e8e8e8; display: flex; flex-direction: column; font-size: 12px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 16px; height: 46px; padding: 0 14px; background: #1e1e1e; border-bottom: 1px solid #2b2b2b;">
    <div style="display: flex; flex-direction: column; min-width: 0;">
      <span class="mono" style="color: #f2f2f2; font-size: 12px; white-space: nowrap;">SEQ_BGM_VS_RAI.dls</span>
      <span style="color: #676767; font-size: 10px; white-space: nowrap;">VGMTrans Output</span>
    </div>
    <div style="width: 1px; height: 26px; background: #2b2b2b;"></div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <div style="width: 7px; height: 7px; border-radius: 50%; background: {{accent}};"></div>
        <span style="color: #a8a8a8; font-size: 10px; letter-spacing: 0.08em;">REVERB</span>
      </div>
      <div style="display: flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; background: #141414; border: 1px solid #2f2f2f; border-radius: 2px;">
        <span style="color: #cfcfcf; font-size: 11px;">Universal</span>
        <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="#5a5a5a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <sc-for list="{{reverb}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 4px;">
          <svg width="20" height="20" viewBox="0 0 26 26">
            <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#2f2f2f" stroke-width="3" stroke-linecap="round"></path>
            <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{r.dash}}"></path>
          </svg>
          <span style="color: #757575; font-size: 10px;">{{r.label}}</span>
        </div>
      </sc-for>
    </div>

    <div style="flex-grow: 1;"></div>
    <div style="width: 1px; height: 26px; background: #2b2b2b;"></div>
    <div style="display: flex; align-items: center; gap: 9px;">
      <span style="color: #a8a8a8; font-size: 10px; letter-spacing: 0.08em;">OUT</span>
      <svg width="26" height="26" viewBox="0 0 26 26">
        <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#2f2f2f" stroke-width="2.8" stroke-linecap="round"></path>
        <circle cx="13" cy="13" r="5.4" fill="#242424" stroke="#383838" stroke-width="0.9"></circle>
        <line x1="13" y1="11" x2="13" y2="6.6" stroke="#f2f2f2" stroke-width="1.8" stroke-linecap="round"></line>
      </svg>
      <span class="mono" style="color: #f2f2f2; font-size: 13px;">0.0 dB</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; height: 20px; padding: 0 14px; color: #5f5f5f; font-size: 10px; letter-spacing: 0.08em; background: #181818;">
    <div style="width: 24px;">CH</div>
    <div style="width: 46px;">PROG</div>
    <div style="flex-grow: 1;">INSTRUMENT</div>
    <div style="width: 86px;">ACTIVITY</div>
    <div style="width: 56px; text-align: center;">VOL</div>
    <div style="width: 56px; text-align: center;">PAN</div>
  </div>

  <sc-for list="{{channels}}" as="ch" hint-placeholder-count="16">
    <div style="display: flex; align-items: center; height: 30px; padding: 0 14px; background: {{ch.rowBg}}; border-bottom: 1px solid #1b1b1b;">
      <div class="mono" style="width: 24px; color: {{ch.chColour}}; font-size: 11px;">{{ch.num}}</div>
      <div class="mono" style="width: 46px; color: #6f6f6f; font-size: 11px;">{{ch.program}}</div>
      <div style="flex-grow: 1; display: flex; align-items: center; gap: 6px; min-width: 0; opacity: {{ch.fade}};">
        <span style="color: #d2d2d2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ch.name}}</span>
        <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#535353" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
      <div style="width: 86px; display: flex; align-items: center; gap: 2px; padding-right: 12px; box-sizing: border-box;">
        <sc-for list="{{ch.meter}}" as="seg" hint-placeholder-count="12">
          <div style="width: 4px; height: 9px; border-radius: 1px; background: {{seg.fill}};"></div>
        </sc-for>
      </div>
      <div style="width: 56px; display: flex; align-items: center; justify-content: center; gap: 4px; opacity: {{ch.fade}};">
        <svg width="20" height="20" viewBox="0 0 26 26">
          <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#2f2f2f" stroke-width="3" stroke-linecap="round"></path>
          <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-dasharray="{{ch.volDash}}"></path>
        </svg>
        <span class="mono" style="color: #8c8c8c; font-size: 10px; width: 19px;">{{ch.volume}}</span>
      </div>
      <div style="width: 56px; display: flex; align-items: center; justify-content: center; gap: 4px; opacity: {{ch.fade}};">
        <svg width="20" height="20" viewBox="0 0 26 26">
          <path d="M 6.1 19.9 A 9.75 9.75 0 1 1 19.9 19.9" fill="none" stroke="#2f2f2f" stroke-width="3" stroke-linecap="round"></path>
          <line x1="13" y1="3.5" x2="13" y2="5.5" stroke="#4f4f4f" stroke-width="1.5" stroke-linecap="round"></line>
          <line x1="13" y1="13" x2="13" y2="5.6" stroke="#cccccc" stroke-width="2.3" stroke-linecap="round" transform="rotate({{ch.panAngle}} 13 13)"></line>
        </svg>
        <span class="mono" style="color: #8c8c8c; font-size: 10px; width: 19px;">{{ch.pan}}</span>
      </div>
    </div>
  </sc-for>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 8px; height: 20px; padding: 0 14px; background: #181818; border-top: 1px solid #262626; color: #5f5f5f; font-size: 10px; letter-spacing: 0.06em;">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#5f5f5f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
    <span>KEYBOARD</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; height: 22px; padding: 0 14px; background: #1e1e1e; color: #6f6f6f; font-size: 11px;">
    <span>Bank loaded successfully.</span>
    <span class="mono">v0.5.1-alpha.6</span>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":920,"height":580}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#d8a24a';
    const rows = [
      ['0:030', 'Multi-Region Instrument', 115, 64, 9],
      ['0:060', 'Single-Region Instrument', 100, 40, 6],
      ['0:029', 'Single-Region Instrument', 104, 88, 7],
      ['0:060', 'Single-Region Instrument', 96, 64, 4],
      ['0:027', 'Multi-Region Instrument', 110, 20, 8],
      ['0:060', 'Single-Region Instrument', 98, 108, 3],
      ['0:061', 'Single-Region Instrument', 92, 64, 5],
      ['0:044', 'Multi-Region Instrument', 106, 50, 2],
      ['0:080', 'Drumset', 120, 64, 11],
      ['0:000', 'Multi-Region Instrument', 100, 64, 0],
      ['0:080', 'Drumset', 118, 64, 6],
      ['0:046', 'Single-Region Instrument', 88, 76, 4],
      ['0:000', 'Multi-Region Instrument', 100, 64, 0],
      ['0:000', 'Multi-Region Instrument', 100, 64, 0],
      ['0:000', 'Multi-Region Instrument', 100, 64, 0],
      ['0:000', 'Multi-Region Instrument', 100, 64, 0]
    ];
    const arc = 45.95;
    const channels = rows.map(function (r, i) {
      const level = r[4];
      const meter = [];
      for (let s = 0; s < 12; s++) {
        meter.push({ fill: s < level ? (s > 9 ? '#c07a5e' : accent) : '#262626' });
      }
      return {
        num: i + 1,
        program: r[0],
        name: r[1],
        volume: r[2],
        pan: r[3],
        meter,
        fade: level > 0 ? '1' : '0.4',
        volDash: (r[2] / 127 * arc).toFixed(1) + ' 100',
        panAngle: (-135 + r[3] / 127 * 270).toFixed(1),
        rowBg: i === 0 ? '#242424' : (i % 2 ? '#171717' : '#131313'),
        chColour: i === 0 ? '#ffffff' : '#6f6f6f'
      };
    });
    const reverb = [
      { label: 'Size', dash: (0.42 * arc).toFixed(1) + ' 100' },
      { label: 'Damp', dash: (0.30 * arc).toFixed(1) + ' 100' },
      { label: 'Width', dash: (0.80 * arc).toFixed(1) + ' 100' },
      { label: 'Level', dash: (0.55 * arc).toFixed(1) + ' 100' }
    ];
    return { accent, channels, reverb };
  }
}
</script>
</body>
</html>
